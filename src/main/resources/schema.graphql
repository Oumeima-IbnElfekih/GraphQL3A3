type Option {
    codeOption:Int libelle:String domaine:String
    responsable:String
    credits:Int
    semestre:Int
    capacite:Int
}
type Etudiant{
    identifiant:String
    nom:String
    prenom:String
    option:Option
    anneeEtude:Int
    email:String
}
type  Queries {
    gelAllOptions:[Option]
    getOptionsByDomaine(domaine:String):[Option]
    geEtudiantById(id: String):Etudiant
}
type Mutations {
    ajouterOption(codeOption:Int,
        libelle:String,domaine:String,
        responsable:String,credits:Int,capacite:Int,
        semestre:Int
    ):Boolean
    modifierOption(codeOption:Int,
        libelle:String,domaine:String,
        responsable:String,credits:Int,capacite:Int,
        semestre:Int):Option
    supprimerOption(code:Int):String
    supprimerEtudiant(id:String):String
    modifierEtudiant(id:String,nom:String,prenom:String,codeOption:Int,anneEtude:Int,email:String):Boolean
}
schema {
    query: Queries
    mutation: Mutations
}